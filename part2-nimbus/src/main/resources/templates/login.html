<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh">
    <form class="card shadow-sm p-4" style="width: 100%; max-width: 380px" action="" method="post" onsubmit="return false;">
      <h1 class="h4 mb-3">Sign in</h1>

      <label for="email" class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" id="email" required="required" autocomplete="username">

      <label for="password" class="form-label">Password</label>
      <input class="form-control mb-4" type="password" name="password" id="password" required="required" autocomplete="current-password">

      <button id="Login" type="button" class="btn btn-primary w-100">Login</button>
      <div id="feedback" class="text-danger small mt-3" role="alert"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="/js/mainjs.js"></script>
</body>
</html>
