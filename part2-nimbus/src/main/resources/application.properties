# Tao khoa moi:  openssl rand -base64 48
security.jwt.secret-key=${JWT_SECRET:AoAdJoPt8DZYOPCqT4BRMaUUZaceKmBVIpJ/qUTbu0NQ3Slk9mzQEFQgzoQXGtEp}
# 1h in millisecond
security.jwt.expiration-time=3600000
